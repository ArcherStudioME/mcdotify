<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCDOTIFY</title>
            <link rel="icon" type="image/png" href="https://i.pinimg.com/236x/38/f4/e0/38f4e07fa2b0188b1b2498ac3ed82506.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #DA291C;
            --primary-yellow: #FFC72C;
            --dark-bg: #121212;
            --panel-bg: #181818;
            --hover-bg: #282828;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent: #FFC72C;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 120px;
        }
        
        /* Sticky Navigation Bar */
        navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 2px solid var(--primary-red);
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .mcdonalds-logo {
            width: 45px;
            height: 45px;
            background-color: var(--primary-red);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(218, 41, 28, 0.4);
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .mcdonalds-logo img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        
        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }
        
        .brand-title span { color: var(--primary-yellow); }
        
        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-select {
            background-color: var(--hover-bg);
            color: var(--text-main);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus { border-color: var(--accent); }

        .nav-search {
            background-color: var(--hover-bg);
            border: 2px solid transparent;
            border-radius: 20px;
            color: var(--text-main);
            padding: 10px 18px;
            width: 250px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .nav-search:focus { border-color: var(--accent); }
        .nav-search::placeholder { color: var(--text-muted); }
        
        /* Main Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
            .nav-controls { flex-direction: column; width: 100%; gap: 10px;}
            .nav-search, .filter-select { width: 100%; }
            navbar { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
        
        /* Playlist Container */
        .playlist-container {
            background-color: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid #282828;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .track-list { width: 100%; border-collapse: collapse; }
        .track-list th { 
            text-align: left; 
            color: var(--text-muted); 
            font-weight: 600; 
            background-color: var(--panel-bg); 
            padding: 12px 10px; 
            font-size: 0.9rem; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            border-bottom: 2px solid var(--hover-bg);
        }
        .track-row { cursor: pointer; border-radius: 5px; transition: background 0.2s; }
        .track-row:hover { background-color: var(--hover-bg); }
        .track-row td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .track-row.active { color: var(--accent); font-weight: bold; }
        
        .track-title { font-weight: bold; }
        .track-artist { color: var(--text-muted); font-size: 0.85rem; display: block; margin-top: 4px; }
        .track-row.active .track-artist { color: #f3f3f3; }
        
        /* Lyrics Panel */
        .lyrics-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #282828;
            height: 70vh;
        }
        
        .lyrics-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--hover-bg);
            padding-bottom: 10px;
            color: var(--primary-yellow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .lyrics-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            padding: 20px 10px;
            scroll-behavior: smooth;
        }
        
        .lyric-line {
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .lyric-line.active {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            transform: scale(1.05);
            text-shadow: 0 0 10px rgba(255, 199, 44, 0.3);
        }

        .lyrics-placeholder {
            color: var(--text-muted);
            font-style: italic;
            margin: auto;
            text-align: center;
        }
        
        /* Bottom Player Bar */
        .player-bar {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 90px;
            background-color: var(--panel-bg); 
            border-top: 2px solid var(--primary-red);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 20px; 
            box-sizing: border-box; 
            z-index: 2000;
        }
        
        .now-playing { display: flex; align-items: center; width: 25%; }
        .album-cover { 
            width: 56px; height: 56px; border-radius: 6px; 
            background-color: #282828; object-fit: cover;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: opacity 0.3s;
            border: 1px solid rgba(255,199,44,0.3);
            flex-shrink: 0;
        }
        .now-playing-info { margin-left: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .now-playing-title { font-weight: bold; font-size: 0.9rem; margin: 0; }
        .now-playing-artist { color: var(--text-muted); font-size: 0.75rem; margin: 4px 0 0 0; }
        
        .controls-container { display: flex; flex-direction: column; align-items: center; width: 45%; max-width: 550px; }
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
        .controls button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; transition: color 0.2s; }
        .controls button:hover { color: var(--accent); }
        .controls button.active-mode { color: var(--accent); text-shadow: 0 0 8px rgba(255,199,44,0.6); }
        
        .controls .play-btn { 
            background-color: var(--accent); color: #000; width: 36px; height: 36px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; 
            font-weight: bold; 
            transition: transform 0.1s, background-color 0.2s; 
            box-shadow: 0 0 10px rgba(255,199,44,0.4);
        }
        .controls .play-btn:hover { background-color: #ffd86b; transform: scale(1.08); }
        
        .progress-container { display: flex; align-items: center; width: 100%; gap: 10px; font-size: 0.75rem; color: var(--text-muted); }
        .progress-bar { flex: 1; height: 5px; background-color: #333; border-radius: 3px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background-color: var(--accent); border-radius: 3px; width: 0%; pointer-events: none; }
        .progress-bar:hover .progress-fill { background-color: #ffd86b; }
        
        .volume-container { width: 25%; display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: var(--text-muted); }
        .volume-slider { width: 100px; height: 4px; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>
    
    <navbar>
        <div class="nav-brand">
            <div class="mcdonalds-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/McDonald%27s_Golden_Arches.svg/1280px-McDonald%27s_Golden_Arches.svg.png" alt="Logo">
            </div>
            <div class="brand-title">MC<span>DOTIFY</span></div>
        </div>
        <div class="nav-controls">
            <select id="artist-filter" class="filter-select">
                <option value="all">All Artists</option>
            </select>
            <input type="text" id="search-input" class="nav-search" placeholder="Search track or album...">
        </div>
    </navbar>
    
    <div class="workspace">
        <div class="playlist-container">
            <table class="track-list">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">#</th>
                        <th>Title</th>
                        <th>Album</th>
                    </tr>
                </thead>
                <tbody id="playlist-body">
                    <tr><td colspan="3" style="text-align:center; padding: 20px; color: var(--text-muted);">Loading playlist from cloud...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="lyrics-panel">
            <div class="lyrics-header">
                <span>Lyrics</span>
                <span id="lyric-status" style="font-size: 0.8rem; color: var(--text-muted);"></span>
            </div>
            <div class="lyrics-body" id="lyricsBody">
                <div class="lyrics-placeholder">Select a track to load live lyrics</div>
            </div>
        </div>
    </div>
    
    <div class="player-bar">
        <div class="now-playing">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Cover" class="album-cover" id="np-cover">
            <div class="now-playing-info">
                <p class="now-playing-title" id="np-title">Loading...</p>
                <p class="now-playing-artist" id="np-artist">-</p>
            </div>
        </div>
        
        <div class="controls-container">
            <div class="controls">
                <button id="shuffle-btn" title="Shuffle"><i class="fas fa-random"></i></button>
                <button id="prev-btn" title="Previous"><i class="fas fa-step-backward"></i></button>
                <button class="play-btn" id="play-btn" title="Play/Pause"><i class="fas fa-play" id="play-icon" style="margin-left: 2px;"></i></button>
                <button id="next-btn" title="Next"><i class="fas fa-step-forward"></i></button>
                <button id="repeat-btn" title="Repeat"><i class="fas fa-redo"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>
        
        <div class="volume-container">
            <button id="mute-btn" style="background:none; border:none; color:inherit; cursor:pointer;"><i class="fas fa-volume-up" id="volume-icon"></i></button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
    
    <audio id="audio-element"></audio>
    
    <script>
        const CLOUDFLARE_R2_BASE = "https://pub-22f59ed9832f4d46a72c988fe9f4603f.r2.dev/library";
        const PLAYLIST_JSON_URL = "https://pub-22f59ed9832f4d46a72c988fe9f4603f.r2.dev/playlist.json";
        
        let playlist = [];
        let displayPlaylist = []; 

        let currentIndex = 0;
        let isPlaying = false;
        let isShuffled = false;
        let repeatMode = 0; 
        let shuffledOrder = [];
        let currentLyrics = [];
        let currentSearchQuery = "";
        let currentArtistFilter = "all";

        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const playlistBody = document.getElementById('playlist-body');
        const coverImg = document.getElementById('np-cover');
        const searchInput = document.getElementById('search-input');
        const artistSelect = document.getElementById('artist-filter');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        const volumeIcon = document.getElementById('volume-icon');
        const lyricsBody = document.getElementById('lyricsBody');
        const lyricStatus = document.getElementById('lyric-status');

        async function loadPlaylistFromCloud() {
            try {
                const response = await fetch(`${PLAYLIST_JSON_URL}?t=${Date.now()}`);
                
                if (!response.ok) throw new Error("Network response was not ok");
                playlist = await response.json();
                
                playlist.sort((a, b) => a.title.localeCompare(b.title));
                displayPlaylist = [...playlist];
                
                populateArtistFilter();
                initShuffleOrder();
                
                const savedSrc = localStorage.getItem('mcdotify_current_src');
                const savedTime = localStorage.getItem('mcdotify_current_time');
                
                if (savedSrc) {
                    const savedIndex = playlist.findIndex(t => t.src === savedSrc);
                    if (savedIndex !== -1) {
                        loadAndPlayTrack(savedIndex, false, parseFloat(savedTime) || 0);
                    } else if (playlist.length > 0) {
                        setDefaultEmptyState();
                    }
                } else if (playlist.length > 0) {
                    setDefaultEmptyState();
                } else {
                    document.getElementById('np-title').textContent = "Playlist is empty";
                    playlistBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: var(--text-muted);">No songs found in JSON.</td></tr>';
                }
                
                renderPlaylist();
            } catch (err) {
                console.error("Failed to load online playlist:", err);
                document.getElementById('np-title').textContent = "Failed to load playlist";
                playlistBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: #DA291C;">Failed to load playlist from cloud.</td></tr>';
            }
        }

        function setDefaultEmptyState() {
            document.getElementById('np-title').textContent = "Select a track";
            document.getElementById('np-artist').textContent = "-";
        }

        loadPlaylistFromCloud();

        function populateArtistFilter() {
            const artists = new Set();
            playlist.forEach(track => {
                if (track.artist && track.artist !== "Unknown Artist") {
                    artists.add(track.artist);
                }
            });
            
            const sortedArtists = Array.from(artists).sort();
            artistSelect.innerHTML = '<option value="all">All Artists</option>';
            sortedArtists.forEach(artist => {
                const option = document.createElement('option');
                option.value = artist;
                option.textContent = artist;
                artistSelect.appendChild(option);
            });
        }

        function initShuffleOrder() {
            shuffledOrder = displayPlaylist.map((_, i) => i);
            if (isShuffled) {
                for (let i = shuffledOrder.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
                }
            }
        }

        function filterPlaylist() {
            displayPlaylist = playlist.filter(track => {
                const matchesSearch = track.title.toLowerCase().includes(currentSearchQuery.toLowerCase()) || 
                                      track.album.toLowerCase().includes(currentSearchQuery.toLowerCase());
                const matchesArtist = currentArtistFilter === "all" || track.artist === currentArtistFilter;
                return matchesSearch && matchesArtist;
            });
            
            initShuffleOrder();
            renderPlaylist();
        }

        function renderPlaylist() {
            playlistBody.innerHTML = '';
            
            if (displayPlaylist.length === 0) {
                playlistBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: var(--text-muted);">No matches found</td></tr>';
                return;
            }
            
            displayPlaylist.forEach((track, index) => {
                const tr = document.createElement('tr');
                tr.className = 'track-row';
                
                if (playlist[currentIndex] && track.src === playlist[currentIndex].src) {
                    tr.classList.add('active');
                }
                
                tr.innerHTML = `
                    <td style="text-align: center; color: var(--text-muted);">${index + 1}</td>
                    <td>
                        <span class="track-title">${track.title}</span>
                        <span class="track-artist">${track.artist}</span>
                    </td>
                    <td style="color: var(--text-muted);">${track.album}</td>
                `;
                
                tr.addEventListener('click', () => {
                    const globalIndex = playlist.findIndex(t => t.src === track.src);
                    if (globalIndex !== -1) loadAndPlayTrack(globalIndex);
                });
                
                playlistBody.appendChild(tr);
            });
        }

        async function fetchLyrics(trackTitle, artistName) {
            lyricsBody.innerHTML = '<div class="lyrics-placeholder">Loading live lyrics...</div>';
            lyricStatus.textContent = '';
            currentLyrics = [];

            try {
                const cleanTitle = trackTitle.replace(/\(.*?\)/g, '').trim();
                const cleanArtist = artistName.replace(/\(.*?\)/g, '').trim();
                
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(cleanArtist)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const match = data.find(item => item.syncedLyrics) || data[0];
                    if (match && match.syncedLyrics) {
                        currentLyrics = parseSyncedLyrics(match.syncedLyrics);
                        renderStaticLyrics(currentLyrics);
                        lyricStatus.textContent = "Synced";
                        return;
                    } else if (match && match.plainLyrics) {
                        renderPlainLyrics(match.plainLyrics);
                        lyricStatus.textContent = "Plain Text";
                        return;
                    }
                }
            } catch (e) {
                console.error("Lyrics fetch failed", e);
            }

            lyricsBody.innerHTML = '<div class="lyrics-placeholder">No lyrics available</div>';
            lyricStatus.textContent = "";
        }

        function parseSyncedLyrics(lrcString) {
            const lines = lrcString.split('\n');
            const parsed = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            for (let line of lines) {
                const match = timeReg.exec(line);
                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    const millis = parseInt(match[3].padEnd(3, '0'), 10);
                    const timeInSeconds = minutes * 60 + seconds + millis / 1000;
                    const text = line.replace(timeReg, '').trim();
                    if (text) {
                        parsed.push({ time: timeInSeconds, text: text });
                    }
                }
            }
            return parsed;
        }

        function renderStaticLyrics(lyrics) {
            lyricsBody.innerHTML = '';
            lyrics.forEach((l, i) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.dataset.index = i;
                div.textContent = l.text;
                lyricsBody.appendChild(div);
            });
        }

        function renderPlainLyrics(plainText) {
            lyricsBody.innerHTML = '';
            const lines = plainText.split('\n');
            lines.forEach(text => {
                if(text.trim()) {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.textContent = text;
                    lyricsBody.appendChild(div);
                }
            });
        }

        function updateActiveLyric(currentTime) {
            if (!currentLyrics || currentLyrics.length === 0) return;

            let activeIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            const lineElements = lyricsBody.querySelectorAll('.lyric-line');
            lineElements.forEach((el, i) => {
                if (i === activeIndex) {
                    if (!el.classList.contains('active')) {
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    el.classList.remove('active');
                }
            });
        }

        async function getSmartTrackInfo(rawTrack) {
            const cacheKey = "music_cache_" + rawTrack.title;
            const cached = localStorage.getItem(cacheKey);
            if (cached) return JSON.parse(cached);
            
            try {
                const cleanTitle = rawTrack.title.replace(/(official|video|lyrics|audio|music|hd|hq)/gi, '').trim();
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanTitle)}&entity=song&limit=1`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    const match = data.results[0];
                    const info = {
                        title: match.trackName,
                        artist: match.artistName,
                        album: match.collectionName,
                        coverUrl: match.artworkUrl100.replace('100x100bb', '300x300bb')
                    };
                    localStorage.setItem(cacheKey, JSON.stringify(info));
                    return info;
                }
            } catch (e) {}
            
            return {
                title: rawTrack.title,
                artist: rawTrack.artist,
                album: rawTrack.album,
                coverUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=='
            };
        }
        
        async function loadAndPlayTrack(globalIndex, autoPlay = true, startTime = 0) {
            if (!playlist[globalIndex]) return;
            
            currentIndex = globalIndex;
            const rawTrack = playlist[currentIndex];
            
            localStorage.setItem('mcdotify_current_src', rawTrack.src);
            
            renderPlaylist(); 
            
            document.getElementById('np-title').textContent = rawTrack.title;
            document.getElementById('np-artist').textContent = rawTrack.artist;
            coverImg.style.opacity = 0.4;
            
            audio.src = rawTrack.src;
            if (startTime > 0) {
                audio.currentTime = startTime;
            }

            if (autoPlay) {
                audio.play().then(() => {
                    isPlaying = true; updatePlayIcon();
                }).catch(() => {
                    isPlaying = false; updatePlayIcon();
                });
            } else {
                isPlaying = false;
                updatePlayIcon();
            }
            
            fetchLyrics(rawTrack.title, rawTrack.artist);

            const info = await getSmartTrackInfo(rawTrack);
            
            document.getElementById('np-title').textContent = info.title;
            document.getElementById('np-artist').textContent = info.artist;
            coverImg.src = info.coverUrl;
            coverImg.style.opacity = 1;
            
            rawTrack.title = info.title;
            rawTrack.artist = info.artist;
            renderPlaylist();
        }
        
        function togglePlay() {
            if (!audio.src && playlist.length > 0) { 
                const firstGlobalIndex = playlist.findIndex(t => t.src === displayPlaylist[shuffledOrder[0]].src);
                loadAndPlayTrack(firstGlobalIndex !== -1 ? firstGlobalIndex : 0); 
                return; 
            }
            if (isPlaying) { audio.pause(); } else { audio.play(); }
            isPlaying = !isPlaying; updatePlayIcon();
        }
        
        function updatePlayIcon() {
            playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
        }
        
        function playNext() {
            if (displayPlaylist.length === 0) return;
            
            if (repeatMode === 2) {
                audio.currentTime = 0;
                audio.play();
                return;
            }
            
            const currentTrack = playlist[currentIndex];
            let currentDisplayPos = -1;
            
            if (currentTrack) {
                const idx = displayPlaylist.findIndex(t => t.src === currentTrack.src);
                currentDisplayPos = shuffledOrder.indexOf(idx);
            }
            
            let nextDisplayIdx;
            if (currentDisplayPos !== -1 && currentDisplayPos < shuffledOrder.length - 1) {
                nextDisplayIdx = shuffledOrder[currentDisplayPos + 1];
            } else {
                if (repeatMode === 1) {
                    nextDisplayIdx = shuffledOrder[0];
                } else {
                    isPlaying = false; updatePlayIcon();
                    return;
                }
            }
            
            const nextGlobalIndex = playlist.findIndex(t => t.src === displayPlaylist[nextDisplayIdx].src);
            loadAndPlayTrack(nextGlobalIndex);
        }
        
        function playPrev() {
            if (displayPlaylist.length === 0) return;

            const currentTrack = playlist[currentIndex];
            let currentDisplayPos = -1;
            
            if (currentTrack) {
                const idx = displayPlaylist.findIndex(t => t.src === currentTrack.src);
                currentDisplayPos = shuffledOrder.indexOf(idx);
            }
            
            let prevDisplayIdx;
            if (currentDisplayPos > 0) {
                prevDisplayIdx = shuffledOrder[currentDisplayPos - 1];
            } else {
                prevDisplayIdx = shuffledOrder[shuffledOrder.length - 1];
            }
            
            const prevGlobalIndex = playlist.findIndex(t => t.src === displayPlaylist[prevDisplayIdx].src);
            loadAndPlayTrack(prevGlobalIndex);
        }
        
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', playNext);
        prevBtn.addEventListener('click', playPrev);
        
        shuffleBtn.addEventListener('click', () => {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('active-mode', isShuffled);
            initShuffleOrder();
        });
        
        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.classList.remove('active-mode');
                repeatBtn.innerHTML = '<i class="fas fa-redo"></i>';
            } else if (repeatMode === 1) {
                repeatBtn.classList.add('active-mode');
                repeatBtn.innerHTML = '<i class="fas fa-redo"></i>';
            } else {
                repeatBtn.classList.add('active-mode');
                repeatBtn.innerHTML = '<i class="fas fa-redo-alt" style="position:relative"><span style="position:absolute; font-size:9px; bottom:-4px; right:-4px;">1</span></i>';
            }
        });
        
        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            filterPlaylist();
        });
        
        artistSelect.addEventListener('change', (e) => {
            currentArtistFilter = e.target.value;
            filterPlaylist();
        });
        
        audio.addEventListener('ended', playNext);

        // Auto-skip to the next track if a 404 or playback error occurs
        audio.addEventListener('error', (e) => {
            console.warn("Playback or network error encountered (e.g., 404 Not Found). Skipping to next track...", e);
            playNext();
        });

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration) {
                totalTimeEl.textContent = formatTime(audio.duration);
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });
        
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);

                updateActiveLyric(audio.currentTime);

                localStorage.setItem('mcdotify_current_time', audio.currentTime);
            }
        });
        
        progressBar.addEventListener('click', (e) => {
            if (audio.duration) {
                audio.currentTime = (e.offsetX / progressBar.clientWidth) * audio.duration;
            }
        });
        
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            audio.muted = false;
            updateVolumeIcon(audio.volume);
        });
        
        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            updateVolumeIcon(audio.muted ? 0 : audio.volume);
        });
        
        function updateVolumeIcon(vol) {
            if (vol === 0 || audio.muted) {
                volumeIcon.className = "fas fa-volume-mute";
            } else if (vol < 0.5) {
                volumeIcon.className = "fas fa-volume-down";
            } else {
                volumeIcon.className = "fas fa-volume-up";
            }
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
